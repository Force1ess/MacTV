name: Update contributors
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contributors-main
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh README contributors
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/docs/update-contributors.py
      - name: Commit changes
        run: |
          git add README.md docs/README.en.md
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update contributor list'
          git push origin HEAD:main
