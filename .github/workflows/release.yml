name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version to package for a dry run
        default: v1.0
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      version: ${{ steps.version.outputs.version }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MTV_FILE_SIGNING: '0'
      MACTV_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      MTV_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag
        id: version
        run: |
          ruby tools/build/release-version.rb "$MACTV_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "MACTV_BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          test "$(uname -m)" = arm64
          xcodebuild -version
      - name: Restore the exact native runtime
        uses: actions/cache/restore@v4
        id: runtime
        with:
          fail-on-cache-miss: true
          path: |
            vendor/MPVNativeEngine
            vendor/RimeEngine
            vendor/SubtitleTool
            dist/MacTV-native-runtime-sources.tar.gz
          key: mactv-runtime-arm64-xcode26.3-${{ hashFiles('Makefile', 'tools/build/prepare-release-runtime.rb', 'tools/build/package-native-mpv.rb', 'tools/build/native-runtime-materials.rb', 'tools/build/rebuild-native-mpv.rb', 'tools/build/setup-rime-engine.sh', 'tools/build/setup-subtitle-tool.sh', 'resources/native-mpv/**', 'resources/rime/**') }}
      - name: Verify runtime availability
        run: |
          test "${{ steps.runtime.outputs.cache-hit }}" = true
          test -d vendor/MPVNativeEngine
          test -d vendor/RimeEngine
          test -d vendor/SubtitleTool
          test -s dist/MacTV-native-runtime-sources.tar.gz
      - run: make build
      - name: Package installer and source
        run: |
          bash tools/build/package-preview.sh
          git archive --format=tar.gz --output=dist/MacTV-source.tar.gz HEAD
          mkdir -p dist/release
          mv "dist/packages/MacTV-${{ steps.version.outputs.version }}-arm64.dmg" dist/release/
          mv dist/MacTV-source.tar.gz dist/MacTV-native-runtime-sources.tar.gz dist/release/
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.package.outputs.prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes \
            --title "MacTV $RELEASE_TAG" "${args[@]}" \
            --notes 'Apple Silicon · macOS 15+. This build is ad-hoc signed and is not notarized. 此构建采用临时签名，未经 Apple 公证。'
